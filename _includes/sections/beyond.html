{%- assign s = include.section -%}
{%- assign data = site.data.beyond -%}
<section id="{{ s.id }}" aria-labelledby="h-{{ s.id }}">
  <h2 id="h-{{ s.id }}">{{ s.title }}</h2>
  {%- if data.text %}
  <div class="beyond-text">{{ data.text | markdownify }}</div>
  {%- endif %}

  {%- if data.photos.size > 0 %}
  <div class="gallery" data-autoplay="{{ data.autoplay | default: false }}" data-speed="{{ data.autoplay_speed | default: 30 }}">
    <ul class="gallery-track" aria-label="Photo gallery" tabindex="0">
      {%- for photo in data.photos %}
      <li><figure>
        <img src="{{ photo.image | relative_url }}" alt="{{ photo.alt | escape }}" loading="lazy">
        {%- if photo.caption %}<figcaption>{{ photo.caption }}</figcaption>{% endif %}
      </figure></li>
      {%- endfor %}
    </ul>
    <div class="gallery-nav" hidden>
      <button class="text-btn gallery-pause" type="button" hidden>Pause</button>
      <button class="text-btn" type="button" data-dir="-1" aria-label="Previous photos">←</button>
      <button class="text-btn" type="button" data-dir="1" aria-label="Next photos">→</button>
    </div>
  </div>
  {%- endif %}
</section>
