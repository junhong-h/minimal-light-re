{%- assign s = include.section -%}
<section id="{{ s.id }}" aria-labelledby="h-{{ s.id }}">
  <h2 id="h-{{ s.id }}">{{ s.title }}</h2>
  <div class="svc">
    {%- for group in site.data.services %}
    <div>
      <h3>{{ group.category }}</h3>
      <ul>
        {%- for item in group.items %}
        <li>{% if item.url %}<a href="{{ item.url }}">{{ item.name }}</a>{% else %}{{ item.name }}{% endif %}</li>
        {%- endfor %}
      </ul>
    </div>
    {%- endfor %}
  </div>
</section>
