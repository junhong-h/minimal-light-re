# =============================================================
# 站点配置
# 修改本文件后，本地需要重启 `bundle exec jekyll serve` 才会生效。
# =============================================================

# ---------- 基本信息 ----------
title: Your Name
position: Ph.D. Student
affiliation: Your Affiliation
affiliation_link:            # 可选：单位主页链接
email: yourname (at) example.edu

# ---------- 站点地址 ----------
# 部署到 https://<username>.github.io 时，url 填该地址，baseurl 留空
url: https://junhong-h.github.io
baseurl: ""

# ---------- SEO ----------
keywords: minimal light
description: The Minimal Light is a simple and elegant jekyll theme for academic personal homepage.

# ---------- 社交链接（不需要的项直接删除）----------
google_scholar: https://scholar.google.com/
cv_link: /assets/files/curriculum_vitae.pdf
github_link: https://github.com/
linkedin: https://www.linkedin.com/
twitter: https://twitter.com/

# ---------- 图片 ----------
avatar: /assets/img/avatar.png
favicon: /assets/img/favicon.png            # 浅色模式
favicon_dark: /assets/img/favicon-dark.png  # 深色模式

# ---------- 外观 ----------
font: "Serif"           # "Serif" 或 "Sans Serif"
auto_dark_mode: true    # 跟随系统自动切换深色模式
enable_footnote: true   # 页脚 "Powered by Jekyll and Minimal Light theme."

# ---------- 统计（可选）----------
# Google Analytics 4 的测量 ID，形如 G-XXXXXXXXXX；不用则保持注释
# google_analytics: G-XXXXXXXXXX

# ---------- 构建 ----------
theme: null   # 不使用 GitHub Pages 默认主题（jekyll-theme-primer）
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/
